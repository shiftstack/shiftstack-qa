---
- name: Set artifact paths and OTE vs legacy mode
  ansible.builtin.set_fact:
    all_tests_path: >-
      {{ openstack_test_results_dir }}/openstack_tests.txt
    allowlist_path: >-
      {{ openstack_tests_allowlist_file | ternary(openstack_test_results_dir + '/allowlist.txt', '') }}
    blocklist_path: >-
      {{ openstack_tests_blocklist_file | ternary(openstack_test_results_dir + '/blocklist.txt', '') }}
    tests_to_run_path: >-
      {{ openstack_test_results_dir }}/list_of_tests_to_run.txt
    openstack_test_log_path: >-
      {{ openstack_test_results_dir }}/{{ openstack_test_name }}.log
    openstack_test_junit_path: >-
      {{ openstack_test_results_dir }}/junit_e2e_openstack.xml
    # Upstream dropped make openstack-tests on release-4.20+ (OTE migration,
    # openshift/openstack-test#303 / OSASINFRA-4375; backports #306/#307/#308).
    # Older release branches still ship the legacy target.
    openstack_test_use_ote: "{{ discovered_openshift_release is version('4.20', '>=') }}"

- name: Set openstack-test executable path for OTE
  ansible.builtin.set_fact:
    openstack_test_executable: "{{ home_dir }}/openstack-test-tests-ext"
  when: openstack_test_use_ote | bool

- name: Set openstack-test executable path for legacy openshift-tests
  ansible.builtin.set_fact:
    openstack_test_executable: "{{ home_dir }}/openstack-tests"
  when: not (openstack_test_use_ote | bool)

# --- Build ---
# OTE: make extension → bin/openstack-test-tests-ext (openshift/openstack-test#303)
- name: Build the OTE openstack-test extension binary
  ansible.builtin.shell: |
    source {{ home_dir }}/.bashrc
    make extension
  args:
    chdir: "{{ openstack_test_dir }}"
  changed_when: true
  when: openstack_test_use_ote | bool

- name: Build the legacy openstack-tests binary
  ansible.builtin.shell: |
    source {{ home_dir }}/.bashrc
    make openstack-tests
  args:
    chdir: "{{ openstack_test_dir }}"
  changed_when: true
  when: not (openstack_test_use_ote | bool)

- name: Copy OTE openstack-test executable
  ansible.builtin.copy:
    src: "{{ openstack_test_dir }}/{{ openstack_test_ote_binary_relpath }}"
    dest: "{{ openstack_test_executable }}"
    mode: u=rwx,g=rwx,o=rwx
    remote_src: yes
  when: openstack_test_use_ote | bool

- name: Copy legacy openstack-test executable
  ansible.builtin.copy:
    src: "{{ openstack_test_dir }}/openstack-tests"
    dest: "{{ openstack_test_executable }}"
    mode: u=rwx,g=rwx,o=rwx
    remote_src: yes
  when: not (openstack_test_use_ote | bool)

- name: Remove source directory once compilation succeeded
  ansible.builtin.file:
    path: "{{ openstack_test_dir }}"
    state: absent

# --- List tests ---
- name: Prepare {{ all_tests_path }} with OTE list (names)
  # OTE prints klog to stdout (I0810 ...); strip those so allow/block filters
  # match real test names. stderr discarded for the same reason.
  ansible.builtin.shell: |
    set -o pipefail
    {{ openstack_test_executable }} list \
      --suite {{ openstack_test_suite }} \
      -o names 2>/dev/null \
      | grep -v -E '^I[0-9]{4} ' \
      > {{ all_tests_path }}
  environment:
    OS_CLOUD: "{{ user_cloud }}"
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: true
  when: openstack_test_use_ote | bool

- name: Prepare {{ all_tests_path }} with legacy dry-run
  ansible.builtin.shell: >
    {{ openstack_test_executable }} run openshift/openstack
    --dry-run > {{ all_tests_path }}
  environment:
    OS_CLOUD: "{{ user_cloud }}"
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: true
  when: not (openstack_test_use_ote | bool)

- name: Remove stale allowlist txt before YAML conversion
  ansible.builtin.file:
    path: "{{ allowlist_path }}"
    state: absent
  when: openstack_tests_allowlist_file != ''

- name: Convert the allowlist YAML files to TXT
  ansible.builtin.include_role:
    name: tools_openshift_tests
    tasks_from: convert_yaml_tests_file_to_txt.yml
  vars:
    input_tests_list: "{{ item | trim }}"
    output_tests_list: "{{ allowlist_path }}"
  with_items: "{{ openstack_tests_allowlist_file.split(',') }}"
  when: openstack_tests_allowlist_file != ''

- name: Remove stale blocklist txt before YAML conversion
  ansible.builtin.file:
    path: "{{ blocklist_path }}"
    state: absent
  when: openstack_tests_blocklist_file != ''

- name: Convert the blocklist YAML files to TXT
  ansible.builtin.include_role:
    name: tools_openshift_tests
    tasks_from: convert_yaml_tests_file_to_txt.yml
  vars:
    input_tests_list: "{{ item | trim }}"
    output_tests_list: "{{ blocklist_path }}"
    # Flat regex map (same shape as lb allowlist); not conformance version-keyed YAML.
    yaml_format_based_on_ocp_version: false
  with_items: "{{ openstack_tests_blocklist_file.split(',') }}"
  when: openstack_tests_blocklist_file != ''

- name: Prepare the tests list to run
  shiftstack.tools.filter_tests_list:
    input_tests_file: "{{ all_tests_path }}"
    allowlist_file: "{{ allowlist_path }}"
    blocklist_file: "{{ blocklist_path }}"
    output_file: "{{ tests_to_run_path }}"

- name: Detect whether allow or block list filtering is active
  ansible.builtin.set_fact:
    openstack_test_filtering: "{{ (openstack_tests_allowlist_file | length > 0) or (openstack_tests_blocklist_file | length > 0) }}"

# Serial coda: pull matchers (Machine leak cluster + suite-load flakes)
# out of the batch list for an ordered serial run after the batch.
# Artifacts land in openstack_test_serial_coda/ (LB-style separate folder).
- name: Ensure serial coda results directory exists
  ansible.builtin.file:
    path: "{{ openstack_test_serial_coda_results_dir }}"
    state: directory
    mode: "0755"
  when:
    - openstack_test_use_ote | bool
    - openstack_test_machines_leak_cluster_serial | bool
    - openstack_test_filtering | bool

- name: Set machines leak-cluster serial list path
  ansible.builtin.set_fact:
    openstack_test_leak_cluster_path: >-
      {{ openstack_test_serial_coda_results_dir }}/list_of_tests_to_run.txt
    openstack_test_leak_cluster_matchers_path: >-
      {{ openstack_test_serial_coda_results_dir }}/machines_leak_cluster_matchers.txt
    openstack_test_serial_coda_log_path: >-
      {{ openstack_test_serial_coda_results_dir }}/{{ openstack_test_name }}.log
    openstack_test_serial_coda_junit_path: >-
      {{ openstack_test_serial_coda_results_dir }}/junit_e2e_openstack.xml
  when:
    - openstack_test_use_ote | bool
    - openstack_test_machines_leak_cluster_serial | bool
    - openstack_test_filtering | bool

# Write matchers one-per-line so multi-word phrases are never shell-split.
- name: Write machines leak-cluster matchers file
  ansible.builtin.copy:
    dest: "{{ openstack_test_leak_cluster_matchers_path }}"
    mode: "0644"
    content: "{{ openstack_test_machines_leak_cluster_matchers | map('trim') | join('\n') }}\n"
  when:
    - openstack_test_use_ote | bool
    - openstack_test_machines_leak_cluster_serial | bool
    - openstack_test_filtering | bool

- name: Split machines leak-cluster tests from batch list for serial coda
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/split_machines_leak_cluster.py"
      - "{{ tests_to_run_path }}"
      - "{{ openstack_test_leak_cluster_path }}"
      - "{{ openstack_test_leak_cluster_matchers_path }}"
  register: openstack_test_leak_cluster_split
  changed_when: true
  when:
    - openstack_test_use_ote | bool
    - openstack_test_machines_leak_cluster_serial | bool
    - openstack_test_filtering | bool

- name: Print machines leak-cluster split summary
  ansible.builtin.debug:
    msg: "{{ openstack_test_leak_cluster_split.stdout | default('leak cluster split skipped') }}"
  when:
    - openstack_test_use_ote | bool
    - openstack_test_machines_leak_cluster_serial | bool
    - openstack_test_filtering | bool

# OTE run-suite often marks every outer JSON result as failed when stderr has
# klog lines (Deserializaion Error: invalid character 'I'...). True outcomes
# live in nested STDOUT JSON / ginkgo SUCCESS!|FAIL! lines — see
# files/ote_resolve_results.py.
- name: Set path to OTE result resolver helper
  ansible.builtin.set_fact:
    openstack_test_ote_resolve_script: "{{ role_path }}/files/ote_resolve_results.py"
  when: openstack_test_use_ote | bool

- name: Run the openshift tests
  block:
    - name: Run OTE suite (no allow/block filter)
      when:
        - openstack_test_use_ote | bool
        - not (openstack_test_filtering | bool)
      block:
        - name: Execute OTE run-suite
          ansible.builtin.shell: >
            {{ openstack_test_executable }} run-suite {{ openstack_test_suite }}
            --junit-path {{ openstack_test_junit_path }}
            > {{ openstack_test_log_path }}
          environment:
            # RHOSO_KUBECONFIG and SHIFTSTACK_PASS_FILE are required for the observability test
            OS_CLOUD: "{{ user_cloud }}"
            KUBECONFIG: "{{ kubeconfig }}"
            RHOSO_KUBECONFIG: "{{ rhoso_kubeconfig }}"
            SHIFTSTACK_PASS_FILE: "{{ kubeadmin_password }}"
          changed_when: true
      always:
        # Rewrite junit from resolved outcomes (OTE's own junit inherits false fails).
        - name: Rewrite junit from resolved OTE run-suite outcomes
          ansible.builtin.command:
            argv:
              - python3
              - "{{ openstack_test_ote_resolve_script }}"
              - junit
              - "{{ openstack_test_log_path }}"
              - "{{ openstack_test_junit_path }}"
          changed_when: true

    # OTE run-test has no --junit-path; synthesize junit via ote_resolve_results.py.
    # lb_tests: run serially — piping the list runs many LBs in parallel and hits
    # Octavia/max-shared-lb timeouts despite [lb][Serial] in test names.
    - name: Run OTE filtered tests serially via run-test and write junit
      ansible.builtin.shell: |
        set -o pipefail
        : > {{ openstack_test_log_path }}
        py_exit=0
        expected=0
        resolve="{{ openstack_test_ote_resolve_script }}"
        while IFS= read -r test || [[ -n "$test" ]]; do
          [[ -z "${test// }" ]] && continue
          expected=$((expected + 1))
          tmp=$(mktemp)
          # OTE often exits non-zero on pass/skip (Deserializaion Error on
          # leading I... klog). Ignore per-test rc; end-of-suite resolver is
          # the source of truth (same as stdin-batch path).
          {{ openstack_test_executable }} run-test --output=json -c 1 "$test" \
            > "$tmp" 2>&1 || true
          cat "$tmp" >> {{ openstack_test_log_path }}
          rm -f "$tmp"
        done < {{ tests_to_run_path }}
        if [ "$expected" -eq 0 ]; then
          echo "ote serial: empty filtered test list (expected=0); failing"
          exit 1
        fi
        python3 "$resolve" junit \
          "{{ openstack_test_log_path }}" "{{ openstack_test_junit_path }}" || py_exit=$?
        failed_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" failed || echo 0)
        skipped_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" skipped || echo 0)
        passed_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" passed || echo 0)
        unknown_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" unknown || echo 0)
        # Require every requested test to resolve as pass/skip/fail (no unknown,
        # no missing entries). Exit 0 with empty/unresolvable output must fail.
        resolvable=$(( ${passed_count:-0} + ${skipped_count:-0} + ${failed_count:-0} ))
        echo "ote serial counts: passed=${passed_count:-0} failed=${failed_count:-0} skipped=${skipped_count:-0} unknown=${unknown_count:-0} expected=$expected resolvable=$resolvable"
        if [ "$py_exit" -ne 0 ] \
          || [ "${failed_count:-0}" -gt 0 ] || [ "${unknown_count:-0}" -gt 0 ] \
          || [ "$resolvable" -ne "$expected" ]; then
          exit 1
        fi
        exit 0
      environment:
        OS_CLOUD: "{{ user_cloud }}"
        KUBECONFIG: "{{ kubeconfig }}"
        RHOSO_KUBECONFIG: "{{ rhoso_kubeconfig }}"
        SHIFTSTACK_PASS_FILE: "{{ kubeadmin_password }}"
      changed_when: true
      when:
        - openstack_test_use_ote | bool
        - openstack_test_filtering | bool
        - openstack_test_ote_run_serial | bool

    - name: Run OTE filtered tests via run-test (stdin batch) and write junit
      ansible.builtin.shell: |
        set -o pipefail
        run_exit=0
        py_exit=0
        resolve="{{ openstack_test_ote_resolve_script }}"
        cat {{ tests_to_run_path }} | {{ openstack_test_executable }} run-test \
          > {{ openstack_test_log_path }} || run_exit=$?
        # OTE run-test often exits non-zero on pass/skip; ignore that when
        # the resolver confirms outcomes (same as serial path).
        python3 "$resolve" junit \
          "{{ openstack_test_log_path }}" "{{ openstack_test_junit_path }}" || py_exit=$?
        failed_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" failed || echo 0)
        skipped_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" skipped || echo 0)
        passed_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" passed || echo 0)
        unknown_count=$(python3 "$resolve" count \
          "{{ openstack_test_log_path }}" unknown || echo 0)
        expected=$(grep -cve '^[[:space:]]*$' {{ tests_to_run_path }} || true)
        # Empty filtered list: run-test exits non-zero with no names, and all
        # counts stay 0 so resolvable==expected would otherwise pass.
        if [ "${expected:-0}" -eq 0 ]; then
          echo "ote batch: empty filtered test list (expected=0); failing"
          exit 1
        fi
        # Require every requested test to resolve as pass/skip/fail (no unknown,
        # no missing entries). Exit 0 with empty/unresolvable output must fail.
        resolvable=$(( ${passed_count:-0} + ${skipped_count:-0} + ${failed_count:-0} ))
        if [ "$run_exit" -ne 0 ] && [ "${failed_count:-0}" -eq 0 ]; then
          echo "ote batch run_exit=$run_exit ignored; resolved passed=${passed_count:-0} failed=0 skipped=${skipped_count:-0} unknown=${unknown_count:-0} expected=$expected"
        fi
        if [ "$py_exit" -ne 0 ] \
          || [ "${failed_count:-0}" -gt 0 ] || [ "${unknown_count:-0}" -gt 0 ] \
          || [ "$resolvable" -ne "$expected" ]; then
          exit 1
        fi
        exit 0
      environment:
        OS_CLOUD: "{{ user_cloud }}"
        KUBECONFIG: "{{ kubeconfig }}"
        RHOSO_KUBECONFIG: "{{ rhoso_kubeconfig }}"
        SHIFTSTACK_PASS_FILE: "{{ kubeadmin_password }}"
      changed_when: true
      when:
        - openstack_test_use_ote | bool
        - openstack_test_filtering | bool
        - not (openstack_test_ote_run_serial | bool)

    - name: Run legacy openstack tests
      ansible.builtin.shell: >
        {{ openstack_test_executable }} run openshift/openstack
        -f {{ tests_to_run_path }}
        --output-file {{ openstack_test_log_path }}
        --junit-dir={{ openstack_test_results_dir }} > /dev/null
      environment:
        # RHOSO_KUBECONFIG and SHIFTSTACK_PASS_FILE are required for the observability test
        OS_CLOUD: "{{ user_cloud }}"
        KUBECONFIG: "{{ kubeconfig }}"
        RHOSO_KUBECONFIG: "{{ rhoso_kubeconfig }}"
        SHIFTSTACK_PASS_FILE: "{{ kubeadmin_password }}"
      changed_when: true
      when: not (openstack_test_use_ote | bool)

  rescue:
    # Resolve counts BEFORE marking UNSTABLE. Shell already ignores false OTE
    # non-zero rc; rescue must still UNSTABLE on failed, unknown, or
    # resolvable!=expected so incomplete resolve cannot silently pass.
    - name: Get the number of failed openstack tests (OTE resolved log)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ openstack_test_ote_resolve_script }}"
          - count
          - "{{ openstack_test_log_path }}"
          - failed
      register: openstack_test_ote_failed_count
      changed_when: false
      failed_when: false
      when: openstack_test_use_ote | bool

    - name: Get the number of passed openstack tests (OTE resolved log)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ openstack_test_ote_resolve_script }}"
          - count
          - "{{ openstack_test_log_path }}"
          - passed
      register: openstack_test_ote_passed_count
      changed_when: false
      failed_when: false
      when: openstack_test_use_ote | bool

    - name: Get the number of unknown openstack tests (OTE resolved log)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ openstack_test_ote_resolve_script }}"
          - count
          - "{{ openstack_test_log_path }}"
          - unknown
      register: openstack_test_ote_unknown_count
      changed_when: false
      failed_when: false
      when: openstack_test_use_ote | bool

    - name: Get the number of skipped openstack tests (OTE resolved log)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ openstack_test_ote_resolve_script }}"
          - count
          - "{{ openstack_test_log_path }}"
          - skipped
      register: openstack_test_ote_skipped_count
      changed_when: false
      failed_when: false
      when: openstack_test_use_ote | bool

    - name: Count expected openstack tests from filtered list
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - "grep -cve '^[[:space:]]*$' '{{ tests_to_run_path }}' || true"
      register: openstack_test_expected_count_cmd
      changed_when: false
      failed_when: false
      when:
        - openstack_test_use_ote | bool
        - tests_to_run_path is defined

    - name: Get the number of failed openstack tests (legacy log)
      ansible.builtin.shell: >
        set -o pipefail &&
        grep -e "^failed:" {{ openstack_test_log_path }} | wc -l
        || true
      register: openstack_test_legacy_failed_count
      changed_when: false
      when: not (openstack_test_use_ote | bool)

    - name: Get the number of passed openstack tests (legacy log)
      ansible.builtin.shell: >
        set -o pipefail &&
        grep -e "^passed:" {{ openstack_test_log_path }} | wc -l
        || true
      register: openstack_test_legacy_passed_count
      changed_when: false
      when: not (openstack_test_use_ote | bool)

    - name: Normalize openstack-test pass/fail counts
      ansible.builtin.set_fact:
        number_of_failed_tests: >-
          {{ (
               openstack_test_ote_failed_count.stdout | default('0')
               if (openstack_test_use_ote | bool)
               else openstack_test_legacy_failed_count.stdout | default('0')
             ) | trim }}
        number_of_passed_tests: >-
          {{ (
               openstack_test_ote_passed_count.stdout | default('0')
               if (openstack_test_use_ote | bool)
               else openstack_test_legacy_passed_count.stdout | default('0')
             ) | trim }}
        number_of_unknown_tests: >-
          {{ (
               openstack_test_ote_unknown_count.stdout | default('0')
               if (openstack_test_use_ote | bool)
               else '0'
             ) | trim }}
        number_of_skipped_tests: >-
          {{ (
               openstack_test_ote_skipped_count.stdout | default('0')
               if (openstack_test_use_ote | bool)
               else '0'
             ) | trim }}
        number_of_expected_tests: >-
          {{ (
               openstack_test_expected_count_cmd.stdout | default('0')
               if (openstack_test_use_ote | bool)
               else '0'
             ) | trim }}

    - name: Compute resolvable openstack-test count
      ansible.builtin.set_fact:
        number_of_resolvable_tests: >-
          {{ (
               (number_of_passed_tests | int)
               + (number_of_skipped_tests | int)
               + (number_of_failed_tests | int)
             ) }}

    - name: Print resolved openstack-test pass/fail counts
      ansible.builtin.debug:
        msg: >-
          openstack-test counts: passed={{ number_of_passed_tests }},
          failed={{ number_of_failed_tests }},
          skipped={{ number_of_skipped_tests | default('0') }},
          unknown={{ number_of_unknown_tests | default('0') }},
          expected={{ number_of_expected_tests | default('0') }},
          resolvable={{ number_of_resolvable_tests | default('0') }}

    - name: Mark the openshift tests as UNSTABLE
      ansible.builtin.include_role:
        name: tools_stage_results
        tasks_from: mark_test_stage_unstable.yml
      vars:
        unstable_msg: >-
          The openshift test Suite failed.
      when: >
        ((number_of_failed_tests | default('0')) | int > 0)
        or ((number_of_unknown_tests | default('0')) | int > 0)
        or (
          (openstack_test_use_ote | bool)
          and (
            (number_of_resolvable_tests | default('0')) | int
            != (number_of_expected_tests | default('0')) | int
          )
        )

    # This fail task is added to detect failures in openstack-test execution
    - name: Fail the playbook in case there are no failed and passed tests
      ansible.builtin.fail:
        msg: >
          openstack-test execution failed or no tests where run!
      when:
        - (number_of_failed_tests | default("0")) | int == 0
        - (number_of_passed_tests | default("0")) | int == 0

    # must-gather only when there are real resolved failures
    - name: Run must-gather
      ansible.builtin.include_role:
        name: tools_must-gather
      vars:
        must_gather_suffix: "openstack-tests"
      when: (number_of_failed_tests | default('0')) | int > 0

# Serial coda after the main batch (or filtered serial) suite.
- name: Run serial-coda tests after main suite
  ansible.builtin.include_tasks: run_machines_leak_cluster_serial.yml
  when:
    - openstack_test_use_ote | bool
    - openstack_test_machines_leak_cluster_serial | bool
    - openstack_test_filtering | bool
    - openstack_test_leak_cluster_path is defined
