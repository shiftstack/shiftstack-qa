---
# defaults file for openstack_test
openstack_test_name: openstack-test
openstack_testsuite_name: openstack
openstack_test_dir: "{{ artifacts_dir }}/{{ openstack_test_name }}"
# Installed binary path is set in run_openstack_test.yml (OTE vs legacy).
openstack_test_executable: "{{ home_dir }}/openstack-tests"
openstack_test_results_dir: "{{ artifacts_dir }}/{{ openstack_test_name }}-results"
openstack_tests_allowlist_file: ""
openstack_tests_blocklist_file: "{{ role_path }}/files/openstack-test-lb-blocklist.yaml"
openstack_tests_go_version: "{{ tests.default_go_version_target }}"
# OTE (OpenShift Tests Extension) — used when discovered_openshift_release >= 4.20
openstack_test_suite: openstack-test/all
openstack_test_ote_binary_relpath: bin/openstack-test-tests-ext
# Run filtered OTE tests one-by-one (required for [lb][Serial] under Octavia limits).
openstack_test_ote_run_serial: false
# Option B: after the main filtered batch suite, run the bogus Machine leak
# cluster serially in fixed order (bz_2073398 cleanup, then Machine trio).
# Keeps the bulk suite in batch to limit wall time. No-ops when the matchers
# are absent (e.g. lb_tests allowlists). Requires OTE filtered run path.
openstack_test_machines_leak_cluster_serial: true
# Ordered substrings matched against list_of_tests_to_run.txt (one phrase
# each; written to a matchers file so shell never splits them). For the
# MachineSet replica matcher, ControlPlane variants are skipped.
openstack_test_machines_leak_cluster_matchers:
  - "Bugfix bz_2073398: [Serial] MachineSet scale-in does not leak OpenStack ports"
  - "Machine are in phase Running"
  - "MachineSet replica number corresponds to the number of Machines"
  - "Machine ProviderSpec is correctly applied to OpenStack instances"
