---
- name: Check LB type svc
  block:
    - name: Generate a test ID for resource naming
      ansible.builtin.set_fact:
        test_id: "lb-tcp-verification"

    - name: Ensure the "{{ test_id }}-ns" project is not already present
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: project.openshift.io/v1
        state: absent
        kind: Project
        name: "{{ test_id }}-ns"

    - name: Create a project, deployment and a LoadBalancer type service
      block:
        - name: Create the resource/manifest file for "{{ test_id }}"
          ansible.builtin.template:
            src: lb_tcp.manifests.yaml.j2
            dest: "{{ home_dir }}/lb_verification_resources.yaml"
            mode: u=rw,g=rw,o=r

        - name: Apply the manifest for resource creation
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            state: present
            src: "{{ home_dir }}/lb_verification_resources.yaml"
            wait: yes
            wait_timeout: 100

    - name: Wait until the LB is created and ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Service
        namespace: "{{ test_id }}-ns"
        name: "{{ test_id }}-svc"
        field_selectors:
          - spec.type=LoadBalancer
      register: test_svc
      until: test_svc.resources[0].status.loadBalancer.ingress[0].ip is defined
      retries: 60
      delay: "{{ wait_delay }}"

    - name: Save the LB ingress address
      ansible.builtin.set_fact:
        lb_ingress_ip: "{{ test_svc.resources[0].status.loadBalancer.ingress[0].ip }}"

    - name: Verify IPv4 External Load Balancer FIP on Openstack
      when:
        - not internal_lb
        - lb_ingress_ip is match(ipv4_regex)
      block:
        - name: Get the LB internal IP on openstack when the lb is using a FIP
          ansible.builtin.command: openstack floating ip show {{ lb_ingress_ip }} -f json
          environment:
            OS_CLOUD: "{{ user_cloud }}"
          register: lb_fip_show
          changed_when: false

        - name: Define the internal IP
          ansible.builtin.set_fact:
            lb_internal_ip: "{{ internal_lb | ternary(lb_ingress_ip, (lb_fip_show.stdout | from_json).fixed_ip_address) }}"

        - name: List load balancers on OpenStack
          ansible.builtin.command: openstack loadbalancer list -f json
          environment:
            OS_CLOUD: "{{ user_cloud }}"
          register: svc_lb_list
          changed_when: false

        - name: Select the LB matching VIP "{{ lb_internal_ip }}"
          ansible.builtin.set_fact:
            svc_lb_matches: "{{ svc_lb_list.stdout | from_json | selectattr('vip_address', 'defined') | selectattr('vip_address', 'equalto', lb_internal_ip) | list }}"

        - name: Check the LB exists with the internal IP (VIP address) "{{ lb_internal_ip }}"
          ansible.builtin.assert:
            that: svc_lb_matches | length > 0
            fail_msg: Could not find a LB in OSP with the vip_address "{{ lb_internal_ip }}"
            success_msg: A LB with the vip_address "{{ lb_internal_ip }}" has been found in OSP

        - name: Detecte LB Octavia provider
          ansible.builtin.debug:
            msg: "Detected LB Octavia provider: {{ svc_lb_matches[0].provider }}"

    - name: Get pod names
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: "{{ test_id }}-ns"
      register: pods
      until: pods | length > 0

    - name: Store pod names
      ansible.builtin.set_fact:
        pod_names: "{{ pods | json_query('resources[*].metadata.name') | list }}"

    - name: Format the LB ingress IP based on whether it is IPv4 or IPv6
      ansible.builtin.set_fact:
        formatted_lb_ingress_ip: "{{ '[' + lb_ingress_ip + ']' if (lb_ingress_ip | regex_search(ipv6_regex)) else lb_ingress_ip }}"
      changed_when: false

    - name: Check connectivity to the svc, and balancing between endpoints
      ansible.builtin.uri:
        url: "http://{{ formatted_lb_ingress_ip }}:80"
        return_content: yes
      register: uri_return
      retries: 10
      delay: 5
      until:
        - "'HELLO! I AM ALIVE!!!' in uri_return.content"
        - pod_item in uri_return.content
      loop: "{{ pod_names }}"
      loop_control:
        loop_var: pod_item

    - name: Check the connectivity to the svc is consistent
      ansible.builtin.uri:
        url: "http://{{ formatted_lb_ingress_ip }}:80"
        return_content: yes
        status_code: 200
      loop: "{{ range(10) | list }}"
      loop_control:
        loop_var: count

    - name: Delete the "{{ test_id }}-ns" project
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: project.openshift.io/v1
        state: absent
        kind: Project
        name: "{{ test_id }}-ns"

    - name: Wait until the project "{{ test_id }}-ns" is deleted
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: project.openshift.io/v1
        kind: Project
        name: "{{ test_id }}-ns"
      register: oc_project
      retries: 20
      delay: 15
      until: oc_project.resources|length == 0

    - name: List load balancers after project deletion
      ansible.builtin.command: openstack loadbalancer list -f json
      environment:
        OS_CLOUD: "{{ user_cloud }}"
      register: svc_lb_after
      changed_when: false
      when:
        - lb_internal_ip is defined
        - lb_internal_ip | length > 0

    - name: Check the LB with "{{ lb_ingress_ip }}" ingress IP has been removed from OSP
      ansible.builtin.assert:
        that:
          - (svc_lb_after.stdout | from_json | selectattr('vip_address', 'defined') | selectattr('vip_address', 'equalto', lb_ingress_ip) | list | length) == 0
          - (svc_lb_after.stdout | from_json | selectattr('vip_address', 'defined') | selectattr('vip_address', 'equalto', lb_internal_ip) | list | length) == 0
        fail_msg: Found a LB in OSP still associated with vip_address "{{ lb_ingress_ip }}" or "{{ lb_internal_ip }}"
      when:
        - lb_internal_ip is defined
        - lb_internal_ip | length > 0

    - name: Check whether the fip "{{ lb_ingress_ip }}" still exists on OSP
      ansible.builtin.command: openstack floating ip show {{ lb_ingress_ip }} -f json
      environment:
        OS_CLOUD: "{{ user_cloud }}"
      register: fip
      failed_when: false
      changed_when: false
      when:
        - lb_internal_ip is defined
        - lb_internal_ip | length > 0

    - name: Check the fip "{{ lb_ingress_ip }}" has been removed from OSP
      ansible.builtin.assert:
        that:
          - fip.rc != 0
        fail_msg: FIP "{{ lb_ingress_ip }}" is still present in OSP
      when:
        - lb_internal_ip is defined
        - lb_internal_ip | length > 0
